name: build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flet and dependencies
        run: |
          pip install --upgrade flet
          pip install requests lxml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'  # 兼容性好
          channel: 'stable'

      - name: Build APK
        run: |
          # 自动确认所有提示
          yes | flet build apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: build/apk/*.apk
