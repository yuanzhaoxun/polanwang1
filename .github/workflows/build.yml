name: build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies into packages folder
        run: |
          pip install --upgrade pip
          pip install flet requests lxml -t packages

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Build APK
        run: yes | flet build apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: build/apk/*.apk
